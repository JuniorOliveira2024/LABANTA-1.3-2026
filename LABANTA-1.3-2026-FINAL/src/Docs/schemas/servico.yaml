components:
  schemas:
    servico:
      type: object
      properties:
        id:
          type: string
          example: "1"
        nome:
          type: string
          example: "Instalacao eletrica"
        desconto:
          type: string
          example: "10"
        categoria:
          type: string
          example: "Eletricidade"
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-03-25T10:00:00.000Z"
        update_at:
          type: string
          format: date-time
          example: "2026-03-25T10:30:00.000Z"
