paths:
  /propostas/:
    get:
      tags:
        - Propostas
      summary: Lista todas as propostas
      responses:
        "200":
          description: Lista de propostas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lista de propostas
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/proposta"
        "500":
          description: Erro ao buscar propostas

  /propostas/create:
    post:
      tags:
        - Propostas
      summary: Cria uma nova proposta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/proposta"
      responses:
        "201":
          description: Proposta criada com sucesso
        "400":
          description: ID de prestacao de servico e preco por hora sao obrigatorios
        "500":
          description: Erro ao criar proposta

  /propostas/get-by-id/{id}:
    get:
      tags:
        - Propostas
      summary: Busca uma proposta pelo id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Proposta encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Proposta encontrada
                  data:
                    $ref: "#/components/schemas/proposta"
        "400":
          description: ID invalido
        "404":
          description: Proposta nao encontrada

  /propostas/update/{id}:
    put:
      tags:
        - Propostas
      summary: Atualiza uma proposta pelo id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/proposta"
      responses:
        "200":
          description: Proposta atualizada com sucesso
        "400":
          description: ID invalido
        "500":
          description: Erro ao atualizar proposta

  /propostas/delete/{id}:
    delete:
      tags:
        - Propostas
      summary: Remove uma proposta pelo id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Proposta removida com sucesso
        "400":
          description: ID invalido
        "500":
          description: Erro ao remover proposta
