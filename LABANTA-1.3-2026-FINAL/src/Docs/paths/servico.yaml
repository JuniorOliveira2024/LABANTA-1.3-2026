paths:
  /services/:
    get:
      tags:
        - Servicos
      summary: Lista todos os servicos
      responses:
        "200":
          description: Servicos buscados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Servicos buscados com sucesso
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/servico"
        "500":
          description: Erro ao buscar servicos

  /services/create:
    post:
      tags:
        - Servicos
      summary: Cria um novo servico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/servico"
      responses:
        "200":
          description: Servico criado com sucesso
        "400":
          description: Dados de servico invalidos

  /services/get-by-id/{id}:
    get:
      tags:
        - Servicos
      summary: Busca um servico pelo id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: Servico encontrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Servico encontrado com sucesso
                  data:
                    $ref: "#/components/schemas/servico"
        "400":
          description: ID de servico nao fornecido
        "404":
          description: Servico nao encontrado

  /services/update/{id}:
    put:
      tags:
        - Servicos
      summary: Atualiza um servico pelo id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/servico"
      responses:
        "200":
          description: Servico atualizado com sucesso
        "400":
          description: ID obrigatorio ou dados invalidos

  /services/delete/{id}:
    delete:
      tags:
        - Servicos
      summary: Apaga um servico pelo id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: Servico apagado com sucesso
        "400":
          description: ID obrigatorio ou erro ao apagar servico
