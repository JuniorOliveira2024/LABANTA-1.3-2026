paths:

  /prestador:
    get:
      summary: Listar todos os prestadores
      tags: [Prestador]
      responses:
        "200":
          description: Lista de prestadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/create:
    post:
      summary: Criar novo prestador
      tags: [Prestador]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestador"
      responses:
        "201":
          description: Prestador criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/get-by-id/{id}:
    get:
      summary: Buscar prestador por ID
      tags: [Prestador]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "pre-001"
      responses:
        "200":
          description: Prestador encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/update/{id}:
    put:
      summary: Actualizar prestador
      tags: [Prestador]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestador"
      responses:
        "200":
          description: Prestador actualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao actualizar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/delete/{id}:
    delete:
      summary: Apagar prestador
      tags: [Prestador]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prestador apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao apagar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
