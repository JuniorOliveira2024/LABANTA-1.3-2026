paths:

  /service:
    get:
      summary: Listar todos os serviços
      tags: [Servico]
      responses:
        "200":
          description: Lista de serviços
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /service/create:
    post:
      summary: Criar novo serviço
      tags: [Servico]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateService"
      responses:
        "201":
          description: Serviço criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /service/get-by-id/{id}:
    get:
      summary: Buscar serviço por ID
      tags: [Servico]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "svc-001"
      responses:
        "200":
          description: Serviço encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /service/update/{id}:
    put:
      summary: Actualizar serviço
      tags: [Servico]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateService"
      responses:
        "200":
          description: Serviço actualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao actualizar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /service/delete/{id}:
    delete:
      summary: Apagar serviço
      tags: [Servico]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Serviço apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Erro ao apagar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
